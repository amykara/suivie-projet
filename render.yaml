databases:
  - name: tableau-de-bord-db
    plan: free

services:
  - type: web
    name: tableau-de-bord
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn project.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: tableau-de-bord-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.4"
